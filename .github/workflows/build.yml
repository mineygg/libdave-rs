name: Prebuild

# Reusable workflow: builds the Node addon for every supported platform.

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux (zig cross-compilation from x64, glibc 2.17 baseline) ----
          # Node 24+ ships no 32-bit ARM images, so the armv7 smoke tests stay on Node 22.
          - { platform: linux-x64-gnu,         target: x86_64-unknown-linux-gnu,       os: ubuntu-latest, zig: x86_64-unknown-linux-gnu.2.17,        docker: linux/amd64,  image: node:26-bookworm-slim }
          - { platform: linux-arm64-gnu,       target: aarch64-unknown-linux-gnu,      os: ubuntu-latest, zig: aarch64-unknown-linux-gnu.2.17,       docker: linux/arm64,  image: node:26-bookworm-slim }
          - { platform: linux-arm-gnueabihf,   target: armv7-unknown-linux-gnueabihf,  os: ubuntu-latest, zig: armv7-unknown-linux-gnueabihf.2.17,   docker: linux/arm/v7, image: node:22-bookworm-slim }
          - { platform: linux-x64-musl,        target: x86_64-unknown-linux-musl,      os: ubuntu-latest, zig: x86_64-unknown-linux-musl,            docker: linux/amd64,  image: node:26-alpine }
          - { platform: linux-arm64-musl,      target: aarch64-unknown-linux-musl,     os: ubuntu-latest, zig: aarch64-unknown-linux-musl,           docker: linux/arm64,  image: node:26-alpine }
          - { platform: linux-arm-musleabihf,  target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, zig: armv7-unknown-linux-musleabihf,       docker: linux/arm/v7, image: node:22-alpine }
          # ---- macOS ----
          - { platform: darwin-arm64,          target: aarch64-apple-darwin,           os: macos-latest,   smoke: true, js: true }
          - { platform: darwin-x64,            target: x86_64-apple-darwin,            os: macos-15-intel, smoke: true }
          # ---- Windows (arm64 is cross-compiled, so it is not smoke tested) ----
          - { platform: win32-x64-msvc,        target: x86_64-pc-windows-msvc,         os: windows-latest, smoke: true }
          - { platform: win32-arm64-msvc,      target: aarch64-pc-windows-msvc,        os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true

      - run: npm ci

      - name: Set up Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (zig cross-compile)
        if: matrix.zig
        run: |
          cargo zigbuild --release --locked -p libdave-node --target ${{ matrix.zig }}
          cp target/${{ matrix.target }}/release/liblibdave_node.so libdave.${{ matrix.platform }}.node

      - name: Build
        if: ${{ !matrix.zig }}
        run: npm run build:native -- --target ${{ matrix.target }}

      - name: Smoke test (native)
        if: matrix.smoke
        run: node scripts/smoke.cjs ./libdave.${{ matrix.platform }}.node

      - name: Set up QEMU
        if: matrix.docker
        uses: docker/setup-qemu-action@v3

      - name: Smoke test (docker)
        if: matrix.docker
        run: >
          docker run --rm --platform ${{ matrix.docker }} -v "$PWD:/work" -w /work
          ${{ matrix.image }} node scripts/smoke.cjs ./libdave.${{ matrix.platform }}.node

      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.platform }}
          path: libdave.${{ matrix.platform }}.node
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # The JS loader and typings are identical on every platform.
      - uses: actions/upload-artifact@v7
        if: matrix.js
        with:
          name: js-binding
          path: |
            binding.cjs
            binding.d.cts
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
