name: Build (cross-compile)

# Reusable workflow: builds `dave-cli` for every supported platform.
# Linux targets are cross-compiled with cargo-zigbuild, macOS/Windows arm/x64 variants are
# cross-compiled on a single runner of the matching OS.

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7

permissions:
  contents: write # TEMP: lets failed builds post their log tail as a commit comment

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux (zig cross-compilation from x64) ----
          - { target: x86_64-unknown-linux-gnu,      os: ubuntu-latest, zig: true, zig-target: x86_64-unknown-linux-gnu.2.17 }
          - { target: aarch64-unknown-linux-gnu,     os: ubuntu-latest, zig: true, zig-target: aarch64-unknown-linux-gnu.2.17, qemu: aarch64, sysroot: /usr/aarch64-linux-gnu, cross-pkg: libc6-arm64-cross }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, zig: true, zig-target: armv7-unknown-linux-gnueabihf.2.17, qemu: arm, sysroot: /usr/arm-linux-gnueabihf, cross-pkg: libc6-armhf-cross }
          - { target: x86_64-unknown-linux-musl,     os: ubuntu-latest, zig: true, zig-target: x86_64-unknown-linux-musl }
          - { target: aarch64-unknown-linux-musl,    os: ubuntu-latest, zig: true, zig-target: aarch64-unknown-linux-musl, qemu: aarch64 }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, zig: true, zig-target: armv7-unknown-linux-musleabihf, qemu: arm }
          # ---- macOS (arm64 runner builds both) ----
          - { target: aarch64-apple-darwin,          os: macos-latest, native: true }
          - { target: x86_64-apple-darwin,           os: macos-latest, native: true }
          # ---- Windows (x64 runner builds both) ----
          - { target: x86_64-pc-windows-msvc,        os: windows-latest, native: true, exe: .exe }
          - { target: aarch64-pc-windows-msvc,       os: windows-latest, exe: .exe }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build (incl. vendored OpenSSL + libdave objects)
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (zig cross-compile)
        if: matrix.zig
        shell: bash
        run: |
          set -o pipefail
          cargo zigbuild --release --locked -p dave-cli --target ${{ matrix.zig-target }} 2>&1 | tee build.log

      - name: Build
        if: ${{ !matrix.zig }}
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --locked -p dave-cli --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Post build log tail (TEMP debugging aid)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || exit 0
          # drop cc-rs's "VAR = None/Some(..)" environment dump, keep the real output
          grep -v -E '^[[:space:]]+[A-Za-z0-9_:-]+ = (None|Some\(|")' build.log > filtered.log || true
          { echo "### build failure: ${{ matrix.target }}"; echo '```'; tail -n 100 filtered.log | tail -c 30000; echo '```'; echo; echo "#### error lines"; echo '```'; grep -n -i -E 'error|fatal|cannot|not found|failed|NMAKE|LNK[0-9]+' filtered.log | tail -n 40 | cut -c1-400; echo '```'; } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md > /dev/null

      - name: Smoke test (native)
        if: ${{ matrix.native || (matrix.zig && !matrix.qemu) }}
        run: target/${{ matrix.target }}/release/dave-cli${{ matrix.exe }} selftest

      - name: Smoke test (qemu-user)
        if: matrix.qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user ${{ matrix.cross-pkg }}
          bin=target/${{ matrix.target }}/release/dave-cli
          if [ -n "${{ matrix.sysroot }}" ]; then
            qemu-${{ matrix.qemu }} -L ${{ matrix.sysroot }} "$bin" selftest
          else
            qemu-${{ matrix.qemu }} "$bin" selftest
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="dave-cli-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/dave-cli${{ matrix.exe }}" "dist/$name/"
          cp LICENSE README.md "dist/$name/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.exe }}" = ".exe" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: dave-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
