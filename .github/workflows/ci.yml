name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --locked

  rust-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p libdave-rs -p libdave-rs-sys --locked

  upstream-tests:
    name: libdave upstream tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: upstream-tests
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev libgmock-dev
      - run: npm run test:upstream
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upstream-results
          path: target/upstream-tests/results.json
          if-no-files-found: ignore
          retention-days: 7

  licenses:
    name: license notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      # `cargo metadata` needs every crate source; nothing is compiled.
      - run: cargo fetch --locked
      - run: node scripts/licenses.mjs --check

  crates:
    name: cargo publish (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      # Packages both crates and compiles them from the packaged files.
      - run: cargo publish --dry-run --locked -p libdave-rs-sys -p libdave-rs

  build:
    name: build
    uses: ./.github/workflows/build.yml

  test:
    name: node ${{ matrix.node }} (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [26]
        include:
          - { os: ubuntu-latest, platform: linux-x64-gnu }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: windows-latest, platform: win32-x64-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.platform }}
      - uses: actions/download-artifact@v8
        with:
          name: js-binding
      - run: npm run build:ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pack

  # Publishes the numbers behind the README badges to the `badges` branch.
  badges:
    name: status badges
    # Runs after failures too, so the badges can show them.
    needs: [build, upstream-tests]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Download test results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: upstream-results
          path: results
      - name: List this run's jobs
        shell: bash # pipefail, so an API error fails the step
        run: >
          gh api --paginate
          "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100"
          --jq '.jobs[]' | jq -s . > jobs.json
      - name: Write badge files
        run: node scripts/badges.mjs jobs.json results/results.json badges
      - name: Push the badges branch
        working-directory: badges
        run: |
          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds.json tests.json
          git commit -q -m 'ci: update status badges'
          # The branch only ever holds the latest numbers.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraHeader=Authorization: Basic $auth" push -f \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" badges
