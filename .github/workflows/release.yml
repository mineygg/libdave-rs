name: Release

# Pushing a `v<version>` tag builds every platform and publishes to npm.
# Requires the `NPM_TOKEN` repository secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 30

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: js-binding
      - run: npm run artifacts
      - name: Require all ten binaries
        run: test "$(find npm -name '*.node' | wc -l)" -eq 10
      - run: npm run build:ts
      # `prepublishOnly` publishes the platform packages first and adds them to
      # the umbrella package's optionalDependencies.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
