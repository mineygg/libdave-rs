[package]
name = "libdave-node"
description = "Node-API bindings for @mineygg/libdave-rs"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
libdave = { path = "../libdave" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
