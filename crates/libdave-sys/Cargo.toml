[package]
name = "libdave-sys"
description = "Raw FFI bindings to Discord's libdave (DAVE E2EE), built from vendored sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# This crate's own code is MIT; the rest covers the bundled C++ sources.
license = "MIT AND BSD-2-Clause AND BSL-1.0 AND Apache-2.0 AND CC0-1.0"
authors.workspace = true
repository.workspace = true
links = "dave"
build = "build.rs"
readme = "README.md"
keywords = ["discord", "dave", "e2ee", "mls", "ffi"]
categories = ["external-ffi-bindings", "cryptography"]
# Only what build.rs compiles, to stay under the crates.io size limit.
include = [
    "/build.rs",
    "/src/**",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_LICENSES",
    "/vendor/libdave/LICENSE",
    "/vendor/libdave/cpp/includes/**",
    "/vendor/libdave/cpp/src/**",
    "/vendor/mlspp/LICENSE",
    "/vendor/mlspp/include/**",
    "/vendor/mlspp/src/**",
    "/vendor/mlspp/third_party/*.hpp",
    "/vendor/mlspp/lib/bytes/include/**",
    "/vendor/mlspp/lib/bytes/src/**",
    "/vendor/mlspp/lib/tls_syntax/include/**",
    "/vendor/mlspp/lib/tls_syntax/src/**",
    "/vendor/mlspp/lib/hpke/include/**",
    "/vendor/mlspp/lib/hpke/src/**",
    "/vendor/nlohmann_json/LICENSE.MIT",
    "/vendor/nlohmann_json/include/**",
]

[features]
default = ["vendored-openssl"]
# Build OpenSSL from source (openssl-src). Disable to link a system OpenSSL >= 3.0.
vendored-openssl = ["openssl-sys/vendored"]
# Enable libdave's on-disk persistent signature keys (Keychain / CNG / key files).
persistent-keys = []

[dependencies]
openssl-sys = "0.9"

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[lints]
workspace = true
