[package]
name = "libdave"
description = "Safe Rust bindings to Discord's DAVE (E2EE audio/video) protocol implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["vendored-openssl"]
vendored-openssl = ["libdave-sys/vendored-openssl"]
persistent-keys = ["libdave-sys/persistent-keys"]

[dependencies]
libdave-sys = { path = "../libdave-sys", version = "0.1.0", default-features = false }

[lints]
workspace = true
