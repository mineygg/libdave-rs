[package]
name = "libdave-rs"
description = "Safe Rust bindings to Discord's DAVE (E2EE audio/video) protocol implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["discord", "dave", "e2ee", "libdave", "webrtc"]
categories = ["api-bindings", "cryptography"]

[features]
default = ["vendored-openssl"]
vendored-openssl = ["libdave-rs-sys/vendored-openssl"]
persistent-keys = ["libdave-rs-sys/persistent-keys"]

[dependencies]
libdave-rs-sys = { path = "../libdave-sys", version = "0.2.0", default-features = false }

[lints]
workspace = true
